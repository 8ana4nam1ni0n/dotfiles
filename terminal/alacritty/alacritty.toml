[general]
import = ["/home/sharp/.config/alacritty/themes/themes/cyber_punk_neon.toml"]

[cursor.style]
blinking = "Off"
shape = "Block"

[env]
TERM = "alacritty"

[font]
size = 12.0

[font.bold]
family = "FiraMono Nerd Font"
style = "Bold"

[font.normal]
family = "FiraMono Nerd Font"

[window]
decorations = "buttonless"
opacity = 0.96
option_as_alt = "Both"
startup_mode = "SimpleFullscreen"

[window.padding]
x = 10
y = 10

